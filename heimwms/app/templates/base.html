<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Heim-WMS{% endblock %}</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; }
  nav { background: #1565c0; color: #fff; padding: .7rem 1.2rem; display: flex; gap: 1.4rem; align-items: center; }
  nav a { color: #fff; text-decoration: none; font-weight: 500; }
  nav a:hover { text-decoration: underline; }
  .container { max-width: 960px; margin: 1rem auto; padding: 0 1rem; }
  table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); margin-bottom: 1.5rem; }
  th, td { padding: .55rem .7rem; border-bottom: 1px solid #ddd; text-align: left; }
  th { background: #e3f2fd; font-size: .85rem; text-transform: uppercase; letter-spacing: .03em; }
  form.inline { display: flex; flex-wrap: wrap; gap: .5rem; align-items: flex-end; margin-bottom: 1.5rem; }
  form.inline label { display: flex; flex-direction: column; font-size: .8rem; }
  form.inline input, form.inline select { padding: .35rem .5rem; border: 1px solid #bbb; border-radius: 3px; }
  .btn { padding: .45rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-size: .9rem; }
  .btn-primary { background: #1565c0; color: #fff; }
  .btn-primary:hover { background: #0d47a1; }
  h1 { font-size: 1.4rem; margin-top: 0; }
  .flash { padding: .5rem .8rem; border-radius: 4px; margin-bottom: 1rem; }
  .flash.ok { background: #c8e6c9; }
  .flash.err { background: #ffcdd2; }
</style>
{% block head_extra %}{% endblock %}
</head>
<body>
<nav>
  <a href="{{ base_url(request) }}/locations">Lagerorte</a>
  <a href="{{ base_url(request) }}/items">Artikel</a>
  <a href="{{ base_url(request) }}/scan">Scan</a>
  <a href="{{ base_url(request) }}/overview">Übersicht</a>
  <a href="{{ base_url(request) }}/labels">Etiketten</a>
  <a href="{{ base_url(request) }}/help">Hilfe</a>
</nav>
<div class="container">
{% block content %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
</body>
</html>
