{% extends "base.html" %}
{% block title %}Suche – Heim-WMS{% endblock %}
{% block content %}
<p><a href="{{ base_url(request) }}/overview">&larr; Übersicht</a></p>
<h1>Suchergebnisse für „{{ q }}"</h1>
{% if results %}
<table>
  <thead><tr><th>Code</th><th>Titel</th></tr></thead>
  <tbody>
    {% for it in results %}
    <tr><td><a href="{{ base_url(request) }}/overview/item/{{ it.code }}">{{ it.code }}</a></td><td>{{ it.title }}</td></tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p>Keine Treffer.</p>
{% endif %}
{% endblock %}
